[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-posture-guard"
version = "0.1.0"
description = "Multi-client clean-room repo/worktree boundary guard, RFC 8032 Ed25519 session attestations, and invoice-ready token/seat spend attribution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Agent Posture Guard Contributors" }]
keywords = [
  "ai-agents",
  "clean-room",
  "ed25519",
  "attestation",
  "consulting",
  "git-worktree",
  "governance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
posture-guard = "agent_posture_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
